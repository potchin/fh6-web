services:
  fh6-web:
    image: ghcr.io/potchin/fh6-web:latest
    restart: unless-stopped
    # optional but allows the container to see the
    # real hostnames (which are used as player names)
    network_mode: host
    ports:
      - "8080:8080"
      - "20440:20440/udp"
    environment:
      UDP_PORT: "20440"
