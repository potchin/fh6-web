<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#030712"/>
  <!-- Gauge track (grey arc, bottom-clipped semicircle) -->
  <path d="M 80 340 A 180 180 0 1 1 432 340"
        fill="none" stroke="#1a2d47" stroke-width="28" stroke-linecap="round"/>
  <!-- Gauge fill (blue, ~65%) -->
  <path d="M 80 340 A 180 180 0 0 1 388 178"
        fill="none" stroke="#3b82f6" stroke-width="28" stroke-linecap="round"/>
  <!-- Needle -->
  <line x1="256" y1="332" x2="362" y2="165"
        stroke="#e2e8f0" stroke-width="10" stroke-linecap="round"/>
  <!-- Center hub -->
  <circle cx="256" cy="332" r="18" fill="#0a1628" stroke="#e2e8f0" stroke-width="5"/>
  <!-- Label -->
  <text x="256" y="240" text-anchor="middle"
        font-family="system-ui,-apple-system,Arial,sans-serif"
        font-weight="900" font-size="72" fill="#e2e8f0" letter-spacing="4">FH6</text>
</svg>
