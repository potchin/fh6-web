        <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
        <script src="/car_names.js"></script>
        <script>
            "use strict";

            /* ═══════════════════════════════════════════════════════════════════
             CONFIG & CALIBRATION
             World (positionX, positionZ) → full-res pixel (X, Y) via two
             reference points. Per-axis linear fit handles axis reflection.
             ═══════════════════════════════════════════════════════════════════ */
            const CAL_A_WORLD = [-119.49154, 3888.595];
            const CAL_A_PIX = [2089486, 2087415];
            const CAL_B_WORLD = [-7104.7695, -1863.08];
            const CAL_B_PIX = [2086885, 2089556];

            const TILE_ZOOM = 14; // native tile max zoom
            const VIEW_MAX = 15; // allow zooming past tiles (upscale)
            const VIEW_MIN = 9;
            const DEFAULT_ZOOM = 14;
            const DEFAULT_CENTER_PIX = [
                (8128 * 256 + 8192 * 256) / 2, // = 2088960
                (8128 * 256 + 8192 * 256) / 2,
            ];

            // Pre-compute slope + intercept for each axis once.
            const _mX =
                (CAL_B_PIX[0] - CAL_A_PIX[0]) /
                (CAL_B_WORLD[0] - CAL_A_WORLD[0]);
            const _mZ =
                (CAL_B_PIX[1] - CAL_A_PIX[1]) /
                (CAL_B_WORLD[1] - CAL_A_WORLD[1]);
            const _bX = CAL_A_PIX[0] - _mX * CAL_A_WORLD[0];
            const _bY = CAL_A_PIX[1] - _mZ * CAL_A_WORLD[1];

            // Maximum trace points kept in memory per player before oldest are pruned.
            const MAX_TRACE_PTS = 3000;

            /* ═══════════════════════════════════════════════════════════════════
             LEAFLET MAP SETUP
             ═══════════════════════════════════════════════════════════════════ */

            // XYZ tile pyramid uses Y-down pixel space. Extend L.CRS.Simple with
            // a neutral transformation (Y NOT flipped) so tile row ordering and
            // unproject() both operate in the same coordinate frame.
            const FH6CRS = L.Util.extend({}, L.CRS.Simple, {
                transformation: new L.Transformation(1, 0, 1, 0),
            });

            const map = L.map("map", {
                crs: FH6CRS,
                attributionControl: false,
                zoomControl: true,
                minZoom: VIEW_MIN,
                maxZoom: VIEW_MAX,
                // Prevent pinch-to-zoom from temporarily exceeding min/maxZoom.
                bounceAtZoomLimits: false,
            });

            L.tileLayer("/maptiles/{z}/{y}/{x}.jpg", {
                minZoom: VIEW_MIN,
                maxZoom: VIEW_MAX,
                maxNativeZoom: TILE_ZOOM,
                tileSize: 256,
                noWrap: true,
                keepBuffer: 2,
            }).addTo(map);

            // Separate layer groups so traces always render below markers.
            const traceGroup = L.layerGroup().addTo(map);
            const markerGroup = L.layerGroup().addTo(map);

            // Position the initial view at the centre of the Japan tile extent.
            map.setView(
                map.unproject(
                    L.point(DEFAULT_CENTER_PIX[0], DEFAULT_CENTER_PIX[1]),
                    TILE_ZOOM,
                ),
                DEFAULT_ZOOM,
            );

            /* ═══════════════════════════════════════════════════════════════════
             COORDINATE CONVERSION
             ═══════════════════════════════════════════════════════════════════ */

            /**
             * Convert a FH6 world position to a Leaflet LatLng via pixel calibration.
             * @param {number} worldX  – packet positionX
             * @param {number} worldZ  – packet positionZ
             * @returns {L.LatLng}
             */
            function worldToLatLng(worldX, worldZ) {
                const pixX = _mX * worldX + _bX;
                const pixY = _mZ * worldZ + _bY;
                return map.unproject(L.point(pixX, pixY), TILE_ZOOM);
            }

            /* ═══════════════════════════════════════════════════════════════════
             HELPERS
             ═══════════════════════════════════════════════════════════════════ */

            /**
             * Returns a CSS colour for a tyre temperature (°C).
             * Thresholds match fh6-tel defaults: cold 60, hot 110, overheated 130.
             */
            function tireTempColor(t) {
                if (t < 60) return "#3b82f6"; // blue  – cold
                if (t < 110) return "#22c55e"; // green – optimal
                if (t < 130) return "#f59e0b"; // amber – hot
                return "#ef4444"; // red   – overheated
            }

            /**
             * Format a lap time given in seconds as  M:SS.mmm
             * Returns '--:--.---' when the value is absent or non-positive.
             */
            function fmtTime(secs) {
                if (!secs || secs <= 0) return "--:--.---";
                const m = Math.floor(secs / 60);
                const s = secs % 60;
                const ss = Math.floor(s);
                const ms = Math.round((s - ss) * 1000);
                return `${m}:${String(ss).padStart(2, "0")}.${String(ms).padStart(3, "0")}`;
            }

            /** Minimal HTML entity escaping for user-controlled strings. */
            function escHtml(s) {
                return String(s)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;");
            }

            /**
             * Produce a DOM-safe id fragment from an arbitrary player id string.
             * Leaflet & querySelector are fine with hyphens/underscores.
             */
            function safeId(id) {
                return String(id).replace(/[^a-zA-Z0-9_\-]/g, "_");
            }

            /** Set innerHTML of an element by id (no-op if element not found). */
            function setHtml(elId, html) {
                const el = document.getElementById(elId);
                if (el) el.innerHTML = html;
            }

            /** Set width% of a bar-fill element. Clamped to [0, 100]. */
            function setBarPct(elId, pct) {
                const el = document.getElementById(elId);
                if (el)
                    el.style.width = `${Math.max(0, Math.min(100, pct)).toFixed(1)}%`;
            }

            /* ═══════════════════════════════════════════════════════════════════
             MAP MARKER  – SVG arrow pointing north, rotated by yaw
             ═══════════════════════════════════════════════════════════════════ */

            /**
             * Create a Leaflet divIcon containing a player name label above a
             * north-pointing SVG arrow, rotated clockwise by headingDeg.
             *
             * Layout (fixed 80 px wide container):
             *   [  pm-label  ]   ← ~16 px tall + 2 px margin
             *   [  28×28 SVG ]   ← arrow centred
             *
             * iconAnchor = [40, 32] pins the SVG centre to the geo position:
             *   x: 80/2  = 40
             *   y: 16+2+14 = 32
             */
            function makeArrowIcon(color, label, headingDeg) {
                const sz = 28;
                // Normalise heading to avoid accumulating huge rotation values.
                const deg = ((headingDeg % 360) + 360) % 360;
                const html =
                    `<div class="pm-wrap">` +
                    `<div class="pm-label">${escHtml(label)}</div>` +
                    `<svg width="${sz}" height="${sz}" viewBox="0 0 24 24">` +
                    `<path transform="rotate(${deg.toFixed(2)},12,12)" ` +
                    `d="M12 2 L20 21 L12 16 L4 21 Z" ` +
                    `fill="${color}" stroke="#000" ` +
                    `stroke-width="1.5" stroke-linejoin="round"/>` +
                    `</svg>` +
                    `</div>`;
                return L.divIcon({
                    className: "player-arrow-icon",
                    html,
                    iconSize: [80, sz + 18],
                    iconAnchor: [40, 32],
                });
            }

            /* ═══════════════════════════════════════════════════════════════════
             CARD DOM  – create once per player, then patch individual elements
             ═══════════════════════════════════════════════════════════════════ */

            /**
             * Build and return the HTML element for a new player card.
             * All value-holding elements carry predictable ids derived from
             * the player's safe id so updateCard() can target them cheaply.
             */
            function createCard(id, label, color) {
                const sid = safeId(id);
                const card = document.createElement("div");
                card.className = "player-card";
                card.id = `card-${sid}`;
                // Coloured left border accent
                card.style.borderLeftColor = color;

                card.innerHTML = `
              <div class="card-header">
                <div class="card-label-row">
                  <span class="color-dot" style="background:${color};--dot-color:${color}" title="Center on map · Double-click to follow" data-center-player="${escHtml(id)}"></span>
                  <span class="player-name" id="pname-${sid}" title="Click to rename" data-player-id="${escHtml(id)}">${escHtml(label)}</span>
                </div>
                <div class="card-hdr-right">
                  <span class="car-class-badge" id="car-class-${sid}">—</span>
                  <span class="race-pos-badge" id="rpos-${sid}" style="display:none"></span>
                </div>
              </div>

              <span class="car-detail" id="car-detail-${sid}"></span>

              <div class="card-mid">
                <div class="card-speed-gear">
                  <span class="speed-val" id="speed-${sid}"><span class="speed-num">—</span><span class="speed-unit">mph</span></span>
                  <span class="gear-box" id="gear-${sid}">—</span>
                </div>
                <div class="card-pedals">
                  <div class="pedal-row">
                    <span class="pedal-lbl t-lbl">T</span>
                    <div class="bar-track"><div class="bar-fill t-fill" id="t-fill-${sid}" style="width:0%"></div></div>
                    <span class="pedal-pct" id="t-pct-${sid}">0%</span>
                  </div>
                  <div class="pedal-row">
                    <span class="pedal-lbl b-lbl">B</span>
                    <div class="bar-track"><div class="bar-fill b-fill" id="b-fill-${sid}" style="width:0%"></div></div>
                    <span class="pedal-pct" id="b-pct-${sid}">0%</span>
                  </div>
                  <div class="pedal-row">
                    <span class="pedal-lbl c-lbl">C</span>
                    <div class="bar-track"><div class="bar-fill c-fill" id="c-fill-${sid}" style="width:0%"></div></div>
                    <span class="pedal-pct" id="c-pct-${sid}">0%</span>
                  </div>
                </div>
              </div>

              <div class="bar-row">
                <span class="bar-row-label">RPM</span>
                <div class="bar-track"><div class="bar-fill" id="rpm-fill-${sid}" style="width:0%;background:${color}"></div></div>
                <span class="bar-row-end" id="rpm-val-${sid}">0</span>
              </div>

              <div class="tire-row">
                <div class="tire-cell" id="tfl-${sid}"><span class="tire-pos">FL</span><span class="tire-temp-val">—°</span></div>
                <div class="tire-cell" id="tfr-${sid}"><span class="tire-pos">FR</span><span class="tire-temp-val">—°</span></div>
                <div class="tire-cell" id="trl-${sid}"><span class="tire-pos">RL</span><span class="tire-temp-val">—°</span></div>
                <div class="tire-cell" id="trr-${sid}"><span class="tire-pos">RR</span><span class="tire-temp-val">—°</span></div>
              </div>

              <div class="lap-row">
                <span class="lap-num">Lap <span id="lapn-${sid}">—</span></span>
                <span class="lap-cur" id="lapc-${sid}">--:--.---</span>
                <span class="lap-best">Best <span id="lapb-${sid}">--:--.---</span></span>
              </div>

              <div class="offline-overlay" id="offline-${sid}">OFFLINE</div>
            `;

                return card;
            }

            /**
             * Patch every value-holding element in an existing player card to
             * reflect the latest telemetry packet.  Called on every update.
             *
             * All arithmetic is kept local so the function is self-contained;
             * no shared mutable state outside the player object.
             */
            function updateCard(player) {
                const { packet: p, color } = player;
                if (!p) return;
                const sid = safeId(player.id);

                /* Speed + Gear */
                const speedMph = Math.round(p.speedMs * 2.23694);
                const speedEl = document.getElementById(`speed-${sid}`);
                if (speedEl) {
                    speedEl.innerHTML = `<span class="speed-num">${speedMph}</span><span class="speed-unit">mph</span>`;
                }
                const gearStr =
                    p.gear === 0 ? "R" : p.gear === 11 ? "N" : String(p.gear);
                setHtml(`gear-${sid}`, gearStr);

                /* RPM bar — colour shifts through player colour → amber → red near limit */
                const rpmPct =
                    p.engineMaxRpm > 0
                        ? Math.min(
                              100,
                              (p.currentEngineRpm / p.engineMaxRpm) * 100,
                          )
                        : 0;
                const rpmFill = document.getElementById(`rpm-fill-${sid}`);
                if (rpmFill) {
                    rpmFill.style.width = `${rpmPct.toFixed(1)}%`;
                    rpmFill.style.background =
                        rpmPct > 90
                            ? "#ef4444"
                            : rpmPct > 78
                              ? "#f59e0b"
                              : color;
                }
                setHtml(
                    `rpm-val-${sid}`,
                    Math.round(p.currentEngineRpm).toLocaleString(),
                );

                /* Pedals – raw 0-255 values → 0-100% */
                const tPct = Math.round((p.throttle / 255) * 100);
                const bPct = Math.round((p.brake / 255) * 100);
                const cPct = Math.round((p.clutch / 255) * 100);
                setBarPct(`t-fill-${sid}`, tPct);
                setBarPct(`b-fill-${sid}`, bPct);
                setBarPct(`c-fill-${sid}`, cPct);
                setHtml(`t-pct-${sid}`, `${tPct}%`);
                setHtml(`b-pct-${sid}`, `${bPct}%`);
                setHtml(`c-pct-${sid}`, `${cPct}%`);

                /* Tyre temperatures */
                updateTireCell(`tfl-${sid}`, "FL", p.tireTempFl);
                updateTireCell(`tfr-${sid}`, "FR", p.tireTempFr);
                updateTireCell(`trl-${sid}`, "RL", p.tireTempRl);
                updateTireCell(`trr-${sid}`, "RR", p.tireTempRr);

                /* Lap info */
                const lapNum = p.lapNumber > 0 ? String(p.lapNumber) : "—";
                setHtml(`lapn-${sid}`, lapNum);
                setHtml(`lapc-${sid}`, fmtTime(p.currentLap));
                setHtml(`lapb-${sid}`, fmtTime(p.bestLap));

                /* In-menu detection: carPi === 0 means no car is loaded */
                const cardEl = document.getElementById(`card-${sid}`);
                const isInMenu = p.carPi === 0;
                if (cardEl) {
                    if (isInMenu) cardEl.dataset.inMenu = "";
                    else delete cardEl.dataset.inMenu;
                }

                /* Car class badge – Forza-style, or IN MENU indicator */
                if (isInMenu) {
                    setHtml(
                        `car-class-${sid}`,
                        `<span class="in-menu-badge">IN MENU</span>`,
                    );
                    setHtml(`car-detail-${sid}`, "");
                } else {
                    const cls = CAR_CLASSES[p.carClass] ?? "?";
                    const clsColor = CAR_CLASS_COLORS[p.carClass] ?? "#6b7280";
                    setHtml(
                        `car-class-${sid}`,
                        `<span class="car-class-letter" style="background:${clsColor}">${cls}</span>` +
                            `<span class="car-pi-val">${p.carPi}</span>`,
                    );

                    /* Car name or debug ordinal */
                    const carName =
                        typeof CAR_NAMES !== "undefined" &&
                        CAR_NAMES[p.carOrdinal];
                    if (carName) {
                        setHtml(`car-detail-${sid}`, escHtml(carName));
                    } else {
                        setHtml(
                            `car-detail-${sid}`,
                            `<span class="car-ordinal">#${p.carOrdinal}</span>`,
                        );
                    }
                }

                /* Race position badge (hide when 0) */
                const rposEl = document.getElementById(`rpos-${sid}`);
                if (rposEl) {
                    if (p.racePosition > 0) {
                        rposEl.textContent = `P${p.racePosition}`;
                        rposEl.style.display = "";
                    } else {
                        rposEl.style.display = "none";
                    }
                }
            }

            /**
             * Style a single tyre cell with temperature-appropriate background/border.
             */
            function updateTireCell(elId, pos, temp) {
                const el = document.getElementById(elId);
                if (!el) return;
                const col = tireTempColor(temp);
                // Use the colour at ~20% opacity as background tint
                el.style.background = col + "28";
                el.style.borderColor = col + "80";
                el.style.color = col;
                el.innerHTML =
                    `<span class="tire-pos">${pos}</span>` +
                    `<span class="tire-temp-val">${Math.round(temp)}°</span>`;
            }

            /* ═══════════════════════════════════════════════════════════════════
             PLAYER STATE MANAGEMENT
             ═══════════════════════════════════════════════════════════════════

             Each player entry:
               id          – string identifier from server
               label       – display name
               color       – CSS colour string (from server)
               packet      – latest TelemetryPacket | null
               online      – true while active
               polyline    – L.Polyline for the driven trace
               marker      – L.Marker for the current position arrow
               tracePoints – L.LatLng[] accumulated route points
               cardEl      – HTMLElement card in #cards-panel
             ═══════════════════════════════════════════════════════════════════ */

            /** @type {Map<string, object>} */
            const players = new Map();

            /* ── Follow mode ────────────────────────────────────────────────────────
             Tracks which player_id (if any) the map should pan to on each update.
             ─────────────────────────────────────────────────────────────────────── */
            let followedPlayerId = null;

            function toggleFollow(id) {
                const panel = document.getElementById("cards-panel");
                // Remove visual from previously-followed dot (if any)
                if (followedPlayerId) {
                    const oldDot = panel.querySelector(
                        `[data-center-player="${followedPlayerId}"]`,
                    );
                    if (oldDot) oldDot.classList.remove("following");
                }
                if (followedPlayerId === id) {
                    // Already following this player — turn off
                    followedPlayerId = null;
                } else {
                    // Start following new player
                    followedPlayerId = id;
                    const dot = panel.querySelector(
                        `[data-center-player="${id}"]`,
                    );
                    if (dot) dot.classList.add("following");
                    centerOnPlayer(id);
                }
            }

            /** FH6 car class index → display label. */
            const CAR_CLASSES = ["D", "C", "B", "A", "S1", "S2", "R"];

            /** Forza-style background colours for each class (matches in-game PI badges). */
            const CAR_CLASS_COLORS = [
                "#6b7280", // D – grey
                "#ca8a04", // C – gold
                "#16a34a", // B – green
                "#2563eb", // A – blue
                "#7c3aed", // S1 – purple
                "#db2777", // S2 – pink
                "#dc2626", // R  – red
            ];

            /**
             * Allocate map layers, DOM card, and bookkeeping for a brand-new player.
             */
            /* ═══════════════════════════════════════════════════════════════════
             PLAYER RENAME  – persisted in localStorage, no server involvement
             ═══════════════════════════════════════════════════════════════════ */

            function lsKey(id) {
                return `fh6.name.${id}`;
            }

            /** Return the user-set display name for a player, or null if none. */
            function customName(id) {
                return localStorage.getItem(lsKey(id)) || null;
            }

            /** Resolve the label to show: custom name beats server-provided label. */
            function displayLabel(id, serverLabel) {
                return customName(id) || serverLabel || id;
            }

            /**
             * Persist a new name, update the card DOM and the map marker label.
             * Pass an empty string to clear the override and revert to the server label.
             */
            function renamePlayer(id, newName) {
                console.log("[rename] renamePlayer called", { id, newName });
                const player = players.get(id);
                if (!player) {
                    console.warn("[rename] player not found", id);
                    return;
                }

                const trimmed = newName.trim();
                if (trimmed) {
                    localStorage.setItem(lsKey(id), trimmed);
                    player.displayName = trimmed;
                } else {
                    localStorage.removeItem(lsKey(id));
                    player.displayName = player.label;
                }

                // Restore / update the name element (may currently be an <input> during edit)
                const sid = safeId(id);
                const nameEl = document.getElementById(`pname-${sid}`);
                console.log(
                    "[rename] nameEl found:",
                    nameEl,
                    "tag:",
                    nameEl?.tagName,
                );
                if (nameEl) {
                    if (nameEl.tagName === "INPUT") {
                        // Replace the input with a fresh span
                        const span = document.createElement("span");
                        span.className = "player-name";
                        span.id = `pname-${sid}`;
                        span.title = "Click to rename";
                        span.setAttribute("data-player-id", id);
                        span.textContent = player.displayName;
                        nameEl.replaceWith(span);
                        console.log("[rename] input replaced with span");
                    } else {
                        nameEl.textContent = player.displayName;
                        console.log("[rename] span textContent updated");
                    }
                } else {
                    console.warn(
                        "[rename] pname element not found for sid:",
                        sid,
                    );
                }

                // Keep the map marker in sync
                if (player.packet && player.markerOnMap) {
                    const { yaw } = player.packet;
                    player.marker.setIcon(
                        makeArrowIcon(
                            player.color,
                            player.displayName,
                            (yaw * 180) / Math.PI,
                        ),
                    );
                }
            }

            /**
             * Swap the player-name span for an <input>, focus it, and wire
             * blur/Enter/Escape to commit or cancel.
             */
            function beginRename(id) {
                console.log("[rename] beginRename called", id);
                const player = players.get(id);
                if (!player) {
                    console.warn("[rename] player not found", id);
                    return;
                }
                const sid = safeId(id);
                const nameEl = document.getElementById(`pname-${sid}`);
                console.log(
                    "[rename] nameEl:",
                    nameEl,
                    "tag:",
                    nameEl?.tagName,
                );
                if (!nameEl || nameEl.tagName === "INPUT") return; // already editing

                const input = document.createElement("input");
                input.type = "text";
                input.id = `pname-${sid}`; // keep same id so renamePlayer can find it
                input.className = "player-name-input";
                input.value = player.displayName;
                input.setAttribute("data-player-id", id);

                nameEl.replaceWith(input);
                input.focus();
                input.select();
                console.log(
                    "[rename] input shown, active element:",
                    document.activeElement?.tagName,
                );

                function commit() {
                    console.log("[rename] commit fired, value:", input.value);
                    renamePlayer(id, input.value);
                }
                function cancel() {
                    console.log("[rename] cancel fired");
                    const span = document.createElement("span");
                    span.className = "player-name";
                    span.id = `pname-${sid}`;
                    span.title = "Click to rename";
                    span.setAttribute("data-player-id", id);
                    span.textContent = player.displayName;
                    input.replaceWith(span);
                }

                input.addEventListener(
                    "blur",
                    (e) => {
                        console.log(
                            "[rename] blur fired, relatedTarget:",
                            e.relatedTarget,
                        );
                        commit();
                    },
                    { once: true },
                );
                input.addEventListener("keydown", (e) => {
                    console.log("[rename] keydown:", e.key);
                    if (e.key === "Enter") {
                        e.preventDefault();
                        input.blur();
                    } else if (e.key === "Escape") {
                        e.preventDefault();
                        input.removeEventListener("blur", commit);
                        cancel();
                    }
                });
            }

            function centerOnPlayer(id) {
                console.log("[center] centerOnPlayer called", id);
                const player = players.get(id);
                console.log(
                    "[center] player:",
                    player,
                    "markerOnMap:",
                    player?.markerOnMap,
                );
                if (!player || !player.markerOnMap) {
                    console.warn(
                        "[center] skipped – player missing or no marker",
                    );
                    return;
                }
                map.panTo(player.marker.getLatLng(), {
                    animate: true,
                    duration: 0.4,
                });
            }

            // Delegated listeners – handle clicks on player name spans and color dots.
            // Single click on dot  → center map on player
            // Double click on dot  → toggle follow mode (map pans with player)
            let _dotClickTimer = null;
            document
                .getElementById("cards-panel")
                .addEventListener("click", (e) => {
                    const nameTarget = e.target.closest(
                        ".player-name[data-player-id]",
                    );
                    if (nameTarget) {
                        beginRename(nameTarget.dataset.playerId);
                        return;
                    }
                    const dotTarget = e.target.closest("[data-center-player]");
                    if (!dotTarget) return;
                    const id = dotTarget.dataset.centerPlayer;
                    // Distinguish single vs double click with a short timer
                    if (_dotClickTimer !== null) {
                        clearTimeout(_dotClickTimer);
                        _dotClickTimer = null;
                        toggleFollow(id);
                    } else {
                        _dotClickTimer = setTimeout(() => {
                            _dotClickTimer = null;
                            centerOnPlayer(id);
                        }, 500);
                    }
                });

            /* Max world-unit delta between consecutive positions before we treat it as
               a fast-travel (teleport). World units ≈ metres in FH6, so 200 = 200 m.
               Top road-speed is ~83 m/s → ~4 m per packet at 20 Hz.  Safe margin. */
            const FAST_TRAVEL_THRESHOLD_SQ = 200 * 200;

            function _makePolyline(color) {
                return L.polyline([], {
                    color,
                    weight: 3,
                    opacity: 0.9,
                    lineJoin: "round",
                    lineCap: "round",
                }).addTo(traceGroup);
            }

            function createPlayer(id, label, color) {
                const polyline = _makePolyline(color);

                // Marker starts at 0,0 — will be repositioned on first packet.
                const marker = L.marker([0, 0], {
                    icon: makeArrowIcon(color, label, 0),
                    interactive: false,
                    zIndexOffset: 1000,
                });
                // Don't add to map yet; wait for a valid position.

                const cardEl = createCard(id, label, color);

                // Remove the "waiting" placeholder on first real player.
                const empty = document.getElementById("empty-state");
                if (empty) empty.remove();

                document.getElementById("cards-panel").appendChild(cardEl);

                const resolved = displayLabel(id, label);

                return {
                    id,
                    label,
                    displayName: resolved,
                    color,
                    packet: null,
                    online: true,
                    polyline, // current active segment polyline
                    allPolylines: [polyline], // all segments (for cleanup)
                    tracePoints: [], // points in the current active segment
                    lastPos: null, // [positionX, positionZ] of last drawn point
                    traceBroken: false, // true → start a fresh segment on next point
                    telemetryHistory: [],
                    cardEl,
                    marker,
                    markerOnMap: false,
                };
            }

            /**
             * Apply a new packet to an existing player: update the trace, move the
             * arrow marker, and refresh the card.
             */
            function applyPacket(player, packet) {
                player.packet = packet;

                /* Accumulate history for dashboard traces. */
                player.telemetryHistory.push({
                    throttle: packet.throttle,
                    brake: packet.brake,
                    speedMs: packet.speedMs,
                });
                if (player.telemetryHistory.length > HIST_MAX)
                    player.telemetryHistory.shift();

                /* Update the card immediately — player.packet is now current.
                   This must happen before the trace block so that any exception
                   in the map/Leaflet code cannot leave the card in a stale state. */
                updateCard(player);

                const { positionX, positionZ, yaw } = packet;
                const isInMenu = packet.carPi === 0;

                try {
                    if (!isInMenu && (positionX !== 0 || positionZ !== 0)) {
                        const latlng = worldToLatLng(positionX, positionZ);
                        const headingDeg = (yaw * 180) / Math.PI;

                        /* ── Trace — detect fast travel or post-menu re-entry ── */
                        let needsBreak = player.traceBroken;
                        if (!needsBreak && player.lastPos) {
                            const dx = positionX - player.lastPos[0];
                            const dz = positionZ - player.lastPos[1];
                            if (dx * dx + dz * dz > FAST_TRAVEL_THRESHOLD_SQ) {
                                needsBreak = true;
                            }
                        }

                        if (needsBreak) {
                            /* Start a new polyline segment so no line is drawn back to the
                           previous position (fast travel or first point after menu). */
                            const seg = _makePolyline(player.color);
                            seg.addLatLng(latlng);
                            player.polyline = seg;
                            player.allPolylines.push(seg);
                            player.tracePoints = [latlng];
                            player.traceBroken = false;

                            /* Prune the oldest segment once we accumulate too many. */
                            const totalPts = player.allPolylines.reduce(
                                (s, p) => s + p.getLatLngs().length,
                                0,
                            );
                            if (
                                totalPts > MAX_TRACE_PTS &&
                                player.allPolylines.length > 1
                            ) {
                                player.allPolylines.shift().remove();
                            }
                        } else {
                            /* Normal incremental append — O(1), no full redraw. */
                            player.tracePoints.push(latlng);
                            if (player.tracePoints.length > MAX_TRACE_PTS) {
                                player.tracePoints.splice(0, 100);
                                player.polyline.setLatLngs(player.tracePoints);
                            } else {
                                player.polyline.addLatLng(latlng);
                            }
                        }

                        player.lastPos = [positionX, positionZ];

                        /* ── Arrow marker ── */
                        if (!player.markerOnMap) {
                            player.marker.addTo(markerGroup);
                            player.markerOnMap = true;
                        }
                        player.marker.setLatLng(latlng);
                        player.marker.setIcon(
                            makeArrowIcon(
                                player.color,
                                player.displayName,
                                headingDeg,
                            ),
                        );

                        /* ── Follow mode: pan map to keep this player centred ── */
                        if (followedPlayerId === player.id) {
                            map.panTo(latlng, {
                                animate: true,
                                duration: 0.25,
                            });
                        }
                    } else if (isInMenu) {
                        /* In menu — break trace so re-entry starts a fresh segment. */
                        player.traceBroken = true;
                        player.lastPos = null;
                    }
                } catch (err) {
                    console.warn("[trace] error:", err);
                }
            }

            /** Show the OFFLINE overlay on the player's card. */
            function markPlayerOffline(player) {
                player.online = false;
                const ov = document.getElementById(
                    `offline-${safeId(player.id)}`,
                );
                if (ov) ov.style.display = "flex";
                // Cancel follow if this player went offline
                if (followedPlayerId === player.id) {
                    const dot = document
                        .getElementById(`card-${safeId(player.id)}`)
                        ?.querySelector("[data-center-player]");
                    if (dot) dot.classList.remove("following");
                    followedPlayerId = null;
                }
            }

            /* ═══════════════════════════════════════════════════════════════════
             WEBSOCKET  &  MESSAGE HANDLING
             ═══════════════════════════════════════════════════════════════════

             Expected message shapes
             ────────────────────────
             State (sent once on connect, initialises all live players):
               { "type": "state",
                 "players": [ { "id": "…", "label": "…", "color": "#…",
                                "packet": { …TelemetryPacket camelCase… } } ] }

             Update (one player's latest telemetry frame):
               { "type": "update",
                 "id": "…", "label": "…", "color": "#…",
                 "packet": { …TelemetryPacket camelCase… } }

             Player left:
               { "type": "player_left", "id": "…" }
             ═══════════════════════════════════════════════════════════════════ */

            let ws = null;
            let reconnectTimer = null;

            function connect() {
                if (ws) return;
                setConnStatus("reconnecting", "● CONNECTING…");

                ws = new WebSocket(`ws://${location.host}/ws`);

                ws.addEventListener("open", () => {
                    setConnStatus("connected", "● CONNECTED");
                    clearTimeout(reconnectTimer);
                    reconnectTimer = null;
                });

                ws.addEventListener("close", () => {
                    setConnStatus("disconnected", "● DISCONNECTED");
                    ws = null;
                    reconnectTimer = setTimeout(connect, 3000);
                });

                ws.addEventListener("error", () => {
                    // 'close' fires right after, which handles reconnect.
                    ws && ws.close();
                });

                ws.addEventListener("message", (evt) => {
                    let msg;
                    try {
                        msg = JSON.parse(evt.data);
                    } catch {
                        return;
                    }
                    handleMessage(msg);
                });
            }

            function handleMessage(msg) {
                switch (msg.type) {
                    case "state": {
                        // players is a dict {ip: {id, label, color, active, packet}}
                        const dict =
                            msg.players && typeof msg.players === "object"
                                ? msg.players
                                : {};
                        for (const entry of Object.values(dict)) {
                            upsertPlayer(entry);
                        }
                        break;
                    }
                    case "update": {
                        // {type, player_id, packet, trace} — normalise to upsertPlayer shape
                        upsertPlayer({
                            id: msg.player_id,
                            packet: msg.packet,
                            trace: msg.trace,
                        });
                        break;
                    }
                    case "player_left": {
                        const player = players.get(String(msg.player_id));
                        if (player) markPlayerOffline(player);
                        break;
                    }
                    default:
                        // Unknown message type – silently ignore.
                        break;
                }
            }

            /**
             * Create a player if not yet seen, or update an existing one.
             * Accepts the shape used by both 'state' array entries and 'update'.
             */
            function upsertPlayer({ id, label, color, packet, trace }) {
                id = String(id);

                let player = players.get(id);
                if (!player) {
                    // Fall back to sensible defaults if the server omits fields.
                    const resolvedColor = color || "#3b82f6";
                    const resolvedLabel = label || id;
                    player = createPlayer(id, resolvedLabel, resolvedColor);
                    // Patch the card name element to show the resolved display name
                    // (createCard receives label, but displayName may differ via localStorage)
                    const sid = safeId(id);
                    const nameEl = document.getElementById(`pname-${sid}`);
                    if (nameEl) nameEl.textContent = player.displayName;
                    players.set(id, player);

                    /* Auto-follow the first (and only) player — user can double-click
                       the dot to toggle off.  Don't override a follow already in progress. */
                    if (players.size === 1 && followedPlayerId === null) {
                        toggleFollow(id);
                    }
                }

                // A player that reconnects should clear the OFFLINE overlay.
                if (!player.online) {
                    player.online = true;
                    const ov = document.getElementById(`offline-${safeId(id)}`);
                    if (ov) ov.style.display = "none";
                }

                if (packet) {
                    applyPacket(player, packet, trace);
                }
            }

            /* ── Connection indicator ─────────────────────────────────────────── */

            function setConnStatus(cssClass, text) {
                const el = document.getElementById("conn-status");
                if (!el) return;
                el.textContent = text;
                el.className = `conn-status ${cssClass}`;
            }

            /* ═══════════════════════════════════════════════════════════════════
             PANEL RESIZER
             Drag #resizer to adjust the map / cards split.
             Direction: left-right on landscape/desktop, top-bottom on portrait.
             The split percentage is persisted in localStorage.
             ═══════════════════════════════════════════════════════════════════ */
            (function initResizer() {
                const resizer = document.getElementById("resizer");
                const mapPanel = document.getElementById("map-panel");
                const cardsPanel = document.getElementById("cards-panel");
                const layout = document.getElementById("main-layout");

                function isRow() {
                    return layout.classList.contains("split-row");
                }

                function applyPct(pct) {
                    if (isRow()) {
                        // Row mode: flex-basis drives width directly.
                        mapPanel.style.height = "";
                        cardsPanel.style.height = "";
                        mapPanel.style.flex = `0 0 ${pct.toFixed(2)}%`;
                        cardsPanel.style.flex = `0 0 ${(100 - pct).toFixed(2)}%`;
                    } else {
                        // Column mode: set explicit pixel heights.
                        // flex-basis percentages in column containers are computed
                        // against the container height, which works in spec-compliant
                        // browsers, but using px is more reliable across iOS Safari.
                        mapPanel.style.flex = "0 0 auto";
                        cardsPanel.style.flex = "0 0 auto";
                        const resizerPx = 5; // matches CSS height: 5px
                        const totalH =
                            layout.getBoundingClientRect().height ||
                            window.innerHeight - 46;
                        const usable = Math.max(0, totalH - resizerPx);
                        const mapH = Math.round((pct / 100) * usable);
                        mapPanel.style.height = `${mapH}px`;
                        cardsPanel.style.height = `${usable - mapH}px`;
                    }
                }

                function currentPct() {
                    if (isRow()) {
                        const m = (mapPanel.style.flex || "").match(
                            /0 0 ([0-9.]+)%/,
                        );
                        return m ? parseFloat(m[1]) : 65;
                    } else {
                        const resizerPx = 5;
                        const totalH =
                            layout.getBoundingClientRect().height - resizerPx;
                        const mapH = mapPanel.getBoundingClientRect().height;
                        return totalH > 0 ? (mapH / totalH) * 100 : 55;
                    }
                }

                function restoreSplit() {
                    const key = isRow() ? "fh6.split.row" : "fh6.split.col";
                    const def = isRow() ? 65 : 55;
                    const saved = parseFloat(localStorage.getItem(key));
                    applyPct(saved >= 10 && saved <= 90 ? saved : def);
                }

                function applyOrientation() {
                    const row =
                        window.innerWidth >= window.innerHeight ||
                        window.innerWidth >= 640;
                    layout.classList.toggle("split-row", row);
                    layout.classList.toggle("split-col", !row);
                    restoreSplit();
                    map.invalidateSize();
                }

                let dragging = false,
                    startPos = 0,
                    startPct = 0;

                function eventPos(e) {
                    const src = e.touches?.[0] ?? e.changedTouches?.[0] ?? e;
                    return isRow() ? src.clientX : src.clientY;
                }

                function onStart(e) {
                    dragging = true;
                    startPos = eventPos(e);
                    startPct = currentPct();
                    resizer.classList.add("dragging");
                    document.body.style.userSelect = "none";
                    document.body.style.cursor = isRow()
                        ? "col-resize"
                        : "row-resize";
                    e.preventDefault();
                }

                function onMove(e) {
                    if (!dragging) return;
                    const totalPx = isRow()
                        ? layout.getBoundingClientRect().width
                        : layout.getBoundingClientRect().height;
                    if (!totalPx) return;
                    const newPct = Math.max(
                        10,
                        Math.min(
                            90,
                            startPct +
                                ((eventPos(e) - startPos) / totalPx) * 100,
                        ),
                    );
                    applyPct(newPct);
                    map.invalidateSize();
                }

                function onEnd() {
                    if (!dragging) return;
                    dragging = false;
                    resizer.classList.remove("dragging");
                    document.body.style.userSelect = "";
                    document.body.style.cursor = "";
                    const key = isRow() ? "fh6.split.row" : "fh6.split.col";
                    localStorage.setItem(key, currentPct().toFixed(2));
                    map.invalidateSize();
                }

                resizer.addEventListener("mousedown", onStart);
                document.addEventListener("mousemove", onMove);
                document.addEventListener("mouseup", onEnd);
                resizer.addEventListener("touchstart", onStart, {
                    passive: false,
                });
                document.addEventListener("touchmove", onMove, {
                    passive: false,
                });
                document.addEventListener("touchend", onEnd);

                window.addEventListener("resize", applyOrientation);
                applyOrientation();
            })();

            /* ── Service Worker registration ──────────────────────────────────────── */
            if ("serviceWorker" in navigator) {
                navigator.serviceWorker
                    .register("/sw.js")
                    .catch((err) =>
                        console.warn("[SW] registration failed:", err),
                    );
            }

            /* ═══════════════════════════════════════════════════════════════════
             DASHBOARD VIEW
             ═══════════════════════════════════════════════════════════════════ */

            const HIST_MAX = 400;
            let dashId = null;
            let dashRaf = null;

            function dashEnter() {
                const ids = [...players.keys()];
                if (ids.length === 1) {
                    dashPick(ids[0]);
                } else {
                    dashShowPicker();
                }
            }

            function dashShowPicker() {
                document.getElementById("dash-picker").style.display = "";
                document.getElementById("dash-telem").style.display = "none";
                const list = document.getElementById("dash-picker-list");
                list.innerHTML = "";

                if (players.size === 0) {
                    list.innerHTML = `<p style="color:var(--tx-xdim);font-size:12px">Waiting for players…</p>`;
                    return;
                }

                for (const [id, pl] of players) {
                    const p = pl.packet;
                    const carName =
                        (typeof CAR_NAMES !== "undefined" &&
                            p &&
                            CAR_NAMES[p.carOrdinal]) ||
                        "";
                    const cls = p ? (CAR_CLASSES[p.carClass] ?? "?") : "?";
                    const clsColor = p
                        ? (CAR_CLASS_COLORS[p.carClass] ?? "#6b7280")
                        : "#6b7280";
                    const speed = p ? Math.round(p.speedMs * 2.23694) : 0;
                    const gear = p
                        ? p.gear === 0
                            ? "R"
                            : p.gear === 11
                              ? "N"
                              : String(p.gear)
                        : "—";

                    const card = document.createElement("button");
                    card.className = "dpk-card";
                    card.style.borderColor = pl.color;
                    card.innerHTML = `
                        <div class="dpk-name">
                            <span class="dpk-dot" style="background:${pl.color}"></span>
                            ${escHtml(pl.displayName)}
                        </div>
                        ${carName ? `<div class="dpk-car">${escHtml(carName)}</div>` : ""}
                        <div class="dpk-stats">
                            <div>
                                <div class="dpk-stat-val">${speed}<span style="font-size:10px;font-weight:400"> mph</span></div>
                                <div>Speed</div>
                            </div>
                            <div>
                                <div class="dpk-stat-val">${gear}</div>
                                <div>Gear</div>
                            </div>
                            <div>
                                <span class="car-class-letter" style="background:${clsColor}">${cls}</span>
                                ${p ? `<span class="car-pi-val">${p.carPi}</span>` : ""}
                            </div>
                        </div>
                    `;
                    card.addEventListener("click", () => dashPick(id));
                    list.appendChild(card);
                }
            }

            /* Cached DOM refs for the dashboard hot path — populated in dashPick. */
            let _dr = {};

            function dashPick(id) {
                dashId = id;
                document.getElementById("dash-picker").style.display = "none";
                document.getElementById("dash-telem").style.display = "flex";

                const pl = players.get(id);
                document.getElementById("dh-dot").style.background = pl.color;
                document.getElementById("dh-name").textContent = pl.displayName;

                _dr = {
                    telemEl: document.getElementById("dash-telem"),
                    rev: document.getElementById("dash-rev"),
                    gear: document.getElementById("d-gear"),
                    spd: document.getElementById("d-spd"),
                    rpmVal: document.getElementById("dt-rpm-val"),
                    boostVal: document.getElementById("dt-boost-val"),
                    boostFill: document.getElementById("dt-boost-fill"),
                    dpT: document.getElementById("dp-t"),
                    dpB: document.getElementById("dp-b"),
                    dpC: document.getElementById("dp-c"),
                    dpTp: document.getElementById("dp-tp"),
                    dpBp: document.getElementById("dp-bp"),
                    dpCp: document.getElementById("dp-cp"),
                    dtFl: document.getElementById("dt-fl"),
                    dtFr: document.getElementById("dt-fr"),
                    dtRl: document.getElementById("dt-rl"),
                    dtRr: document.getElementById("dt-rr"),
                    dtwfFl: document.getElementById("dtwf-fl"),
                    dtwfFr: document.getElementById("dtwf-fr"),
                    dtwfRl: document.getElementById("dtwf-rl"),
                    dtwfRr: document.getElementById("dtwf-rr"),
                    dtwFl: document.getElementById("dtw-fl"),
                    dtwFr: document.getElementById("dtw-fr"),
                    dtwRl: document.getElementById("dtw-rl"),
                    dtwRr: document.getElementById("dtw-rr"),
                    cur: document.getElementById("d-cur"),
                    best: document.getElementById("d-best"),
                    last: document.getElementById("d-last"),
                    lapnum: document.getElementById("d-lapnum"),
                    fuel: document.getElementById("d-fuel"),
                    fuelFill: document.getElementById("dt-fuel-fill"),
                    pwr: document.getElementById("d-pwr"),
                    hb: document.getElementById("d-hb"),
                    steerNeedle: document.getElementById("dt-steer-needle"),
                    dhCar: document.getElementById("dh-car"),
                    dhClass: document.getElementById("dh-class"),
                    dhPos: document.getElementById("dh-pos"),
                    dhLap: document.getElementById("dh-lap"),
                };

                if (!dashRaf) dashRaf = requestAnimationFrame(dashFrame);
            }

            function dashFrame() {
                if (document.body.getAttribute("data-tab") !== "dashboard") {
                    dashRaf = null;
                    return;
                }
                const pl = players.get(dashId);
                if (!pl || !pl.packet) {
                    dashRaf = requestAnimationFrame(dashFrame);
                    return;
                }
                try {
                    const p = pl.packet;
                    const dr = _dr;
                    const isInMenu = p.carPi === 0;

                    /* Menu state toggle — dims live sections via CSS, keeps lap info */
                    dr.telemEl.toggleAttribute("data-in-menu", isInMenu);

                    /* Header (always) */
                    const carName =
                        (typeof CAR_NAMES !== "undefined" &&
                            CAR_NAMES[p.carOrdinal]) ||
                        `#${p.carOrdinal}`;
                    const cls = CAR_CLASSES[p.carClass] ?? "?";
                    const clsColor = CAR_CLASS_COLORS[p.carClass] ?? "#6b7280";
                    dr.dhCar.textContent = isInMenu ? "" : carName;
                    dr.dhClass.innerHTML = isInMenu
                        ? ""
                        : `<span class="car-class-letter" style="background:${clsColor}">${cls}</span>` +
                          `<span class="car-pi-val">${p.carPi}</span>`;
                    dr.dhPos.textContent =
                        p.racePosition > 0 ? `P${p.racePosition}` : "";
                    dr.dhPos.style.display = p.racePosition > 0 ? "" : "none";
                    dr.dhLap.textContent = `Lap ${p.lapNumber > 0 ? p.lapNumber : "—"}`;

                    /* Live telemetry — only meaningful when in-game */
                    if (!isInMenu) {
                        /* Rev bar */
                        dashDrawRevBar(
                            dr.rev,
                            p.currentEngineRpm,
                            p.engineMaxRpm,
                        );

                        /* Speed */
                        dr.spd.textContent = Math.round(p.speedMs * 2.23694);

                        /* Gear + RPM colour */
                        const gearStr =
                            p.gear === 0
                                ? "R"
                                : p.gear === 11
                                  ? "N"
                                  : String(p.gear);
                        const rpmPct =
                            p.engineMaxRpm > 0
                                ? p.currentEngineRpm / p.engineMaxRpm
                                : 0;
                        const gearColor =
                            rpmPct > 0.9
                                ? "#ef4444"
                                : rpmPct > 0.78
                                  ? "#f59e0b"
                                  : "#ffffff";
                        const gearGlow =
                            rpmPct > 0.9
                                ? "0 0 40px rgba(239,68,68,0.8), 0 0 80px rgba(239,68,68,0.3)"
                                : rpmPct > 0.78
                                  ? "0 0 40px rgba(245,158,11,0.7), 0 0 80px rgba(245,158,11,0.2)"
                                  : "0 0 30px rgba(59,130,246,0.5), 0 0 70px rgba(59,130,246,0.15)";
                        dr.gear.textContent = gearStr;
                        dr.gear.style.color = gearColor;
                        dr.gear.style.textShadow = gearGlow;

                        /* RPM text */
                        dr.rpmVal.textContent = `${Math.round(p.currentEngineRpm).toLocaleString()} rpm`;

                        /* Boost */
                        const boostPos = Math.max(0, p.boost);
                        const boostPct = Math.min(100, (boostPos / 2.0) * 100);
                        const boostColor =
                            boostPos > 1.5
                                ? "#ef4444"
                                : boostPos > 0.8
                                  ? "#f59e0b"
                                  : "#3b82f6";
                        dr.boostVal.textContent = p.boost.toFixed(2);
                        dr.boostVal.style.color =
                            boostPos > 0 ? boostColor : "var(--tx)";
                        dr.boostFill.style.width = `${boostPct.toFixed(1)}%`;
                        dr.boostFill.style.background = boostColor;

                        /* Pedals — horizontal bars, no CSS transition */
                        const tPct = Math.round((p.throttle / 255) * 100);
                        const bPct = Math.round((p.brake / 255) * 100);
                        const cPct = Math.round((p.clutch / 255) * 100);
                        dr.dpT.style.width = `${tPct}%`;
                        dr.dpB.style.width = `${bPct}%`;
                        dr.dpC.style.width = `${cPct}%`;
                        dr.dpTp.textContent = `${tPct}%`;
                        dr.dpBp.textContent = `${bPct}%`;
                        dr.dpCp.textContent = `${cPct}%`;

                        /* Steering — steer is signed byte −128…127; map to 0–100% */
                        const steerNorm = (p.steer + 128) / 255;
                        dr.steerNeedle.style.left = `${(steerNorm * 100).toFixed(1)}%`;

                        /* Tires */
                        dashDrawTire(dr.dtFl, p.tireTempFl);
                        dashDrawTire(dr.dtFr, p.tireTempFr);
                        dashDrawTire(dr.dtRl, p.tireTempRl);
                        dashDrawTire(dr.dtRr, p.tireTempRr);

                        /* Tire wear (optional field) */
                        const hasWear = p.tireWearFl != null;
                        [
                            [dr.dtwFl, dr.dtwfFl, p.tireWearFl],
                            [dr.dtwFr, dr.dtwfFr, p.tireWearFr],
                            [dr.dtwRl, dr.dtwfRl, p.tireWearRl],
                            [dr.dtwRr, dr.dtwfRr, p.tireWearRr],
                        ].forEach(([bar, fill, wear]) => {
                            if (!bar || !fill) return;
                            if (hasWear) {
                                bar.style.display = "";
                                const remaining = Math.max(0, 1 - (wear ?? 0));
                                fill.style.width = `${(remaining * 100).toFixed(1)}%`;
                                fill.style.background =
                                    remaining < 0.3
                                        ? "#ef4444"
                                        : remaining < 0.6
                                          ? "#f59e0b"
                                          : "#22c55e";
                            } else {
                                bar.style.display = "none";
                            }
                        });

                        /* Power (W → hp) */
                        const hp = Math.round(Math.abs(p.power) / 745.7);
                        dr.pwr.textContent = `${hp} hp`;

                        /* Handbrake */
                        dr.hb.classList.toggle("active", p.handbrake > 0);
                    }

                    /* Lap times and fuel — valid in menu too */
                    dr.cur.textContent = fmtTime(p.currentLap);
                    dr.best.textContent = fmtTime(p.bestLap);
                    dr.last.textContent = fmtTime(p.lastLap);
                    dr.lapnum.textContent =
                        p.lapNumber > 0 ? String(p.lapNumber) : "—";

                    const fuelPct = Math.round(
                        Math.max(0, Math.min(1, p.fuel)) * 100,
                    );
                    dr.fuel.textContent = `${fuelPct}%`;
                    dr.fuelFill.style.width = `${fuelPct}%`;
                    dr.fuelFill.style.background =
                        fuelPct < 20
                            ? "#ef4444"
                            : fuelPct < 40
                              ? "#f59e0b"
                              : "#22c55e";
                } catch (err) {
                    console.warn("[dash] frame error:", err);
                }
                dashRaf = requestAnimationFrame(dashFrame);
            }

            function dashDrawTire(el, tempC) {
                if (!el) return;
                const col = tireTempColor(tempC);
                el.style.background = col + "28";
                el.style.borderColor = col + "80";
                const t = el.querySelector(".dtt-temp");
                if (t) {
                    t.textContent = `${Math.round(tempC)}°`;
                    t.style.color = col;
                }
            }

            function dashDrawRevBar(canvas, rpm, maxRpm) {
                const W = canvas.width,
                    H = canvas.height;
                if (!W || !H) return;
                const dpr = window.devicePixelRatio || 1;
                const ctx = canvas.getContext("2d");
                const N = 20,
                    pad = 8 * dpr,
                    gap = 3 * dpr;
                const segW = (W - pad * 2 - gap * (N - 1)) / N;
                const pct = maxRpm > 0 ? Math.min(1, rpm / maxRpm) : 0;
                const lit = Math.round(pct * N);

                ctx.clearRect(0, 0, W, H);
                for (let i = 0; i < N; i++) {
                    const x = pad + i * (segW + gap);
                    const on =
                        i < 10 ? "#22c55e" : i < 15 ? "#f59e0b" : "#ef4444";
                    const off =
                        i < 10 ? "#051a0b" : i < 15 ? "#1a1100" : "#1a0303";
                    ctx.shadowColor = on;
                    ctx.shadowBlur = i < lit ? 8 * dpr : 0;
                    ctx.fillStyle = i < lit ? on : off;
                    ctx.beginPath();
                    ctx.roundRect(x, 2 * dpr, segW, H - 4 * dpr, 2 * dpr);
                    ctx.fill();
                }
                ctx.shadowBlur = 0;
            }

            function dashDrawTraces(canvas, history) {
                const W = canvas.width,
                    H = canvas.height;
                if (!W || !H) return;
                const dpr = window.devicePixelRatio || 1;
                const ctx = canvas.getContext("2d");

                ctx.fillStyle = "#020609";
                ctx.fillRect(0, 0, W, H);
                if (history.length < 2) return;

                const N = Math.min(history.length, Math.ceil(W));
                const s = history.length - N;
                const dx = W / N;
                const lh = H / 3;

                /* dividers */
                ctx.strokeStyle = "rgba(255,255,255,0.05)";
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(0, lh);
                ctx.lineTo(W, lh);
                ctx.moveTo(0, lh * 2);
                ctx.lineTo(W, lh * 2);
                ctx.stroke();

                /* speed – slate line (top lane) */
                const maxSpd = history.reduce(
                    (m, h) => Math.max(m, h.speedMs),
                    0.1,
                );
                ctx.strokeStyle = "rgba(148,163,184,0.85)";
                ctx.lineWidth = 1.5 * dpr;
                ctx.beginPath();
                for (let i = 0; i < N; i++) {
                    const h = history[s + i];
                    const x = i * dx;
                    const y = lh - (h.speedMs / maxSpd) * (lh - 2 * dpr);
                    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
                }
                ctx.stroke();

                /* throttle – green fill (middle lane) */
                ctx.fillStyle = "rgba(34,197,94,0.75)";
                ctx.beginPath();
                ctx.moveTo(0, lh * 2);
                for (let i = 0; i < N; i++) {
                    const h = history[s + i];
                    ctx.lineTo(
                        i * dx,
                        lh + lh - (h.throttle / 255) * (lh - 2 * dpr),
                    );
                }
                ctx.lineTo((N - 1) * dx, lh * 2);
                ctx.closePath();
                ctx.fill();

                /* brake – red fill (bottom lane) */
                ctx.fillStyle = "rgba(239,68,68,0.75)";
                ctx.beginPath();
                ctx.moveTo(0, H);
                for (let i = 0; i < N; i++) {
                    const h = history[s + i];
                    ctx.lineTo(
                        i * dx,
                        lh * 2 + lh - (h.brake / 255) * (lh - 2 * dpr),
                    );
                }
                ctx.lineTo((N - 1) * dx, H);
                ctx.closePath();
                ctx.fill();

                /* labels */
                const sz = Math.max(8, 9 * dpr);
                ctx.font = `${sz}px "Courier New",monospace`;
                ctx.fillStyle = "rgba(148,163,184,0.4)";
                ctx.fillText("SPD", 5 * dpr, 11 * dpr);
                ctx.fillStyle = "rgba(34,197,94,0.5)";
                ctx.fillText("THR", 5 * dpr, lh + 11 * dpr);
                ctx.fillStyle = "rgba(239,68,68,0.5)";
                ctx.fillText("BRK", 5 * dpr, lh * 2 + 11 * dpr);
            }

            /* Keep canvas pixel dimensions in sync with CSS layout.
               ResizeObserver fires as soon as the element becomes visible,
               so canvas.width/height are always valid before dashFrame draws. */
            (function initDashCanvasSizing() {
                const dpr = window.devicePixelRatio || 1;
                const ro = new ResizeObserver(function (entries) {
                    for (const e of entries) {
                        const el = e.target;
                        const w = Math.round(e.contentRect.width * dpr);
                        const h = Math.round(e.contentRect.height * dpr);
                        if (w > 0 && h > 0) {
                            el.width = w;
                            el.height = h;
                        }
                    }
                });
                ro.observe(document.getElementById("dash-rev"));
            })();

            /* ── Tab switching ─────────────────────────────────────────────────── */
            (function initTabs() {
                function setTab(tab) {
                    document.body.setAttribute("data-tab", tab);
                    document
                        .querySelectorAll(".tab-btn")
                        .forEach(function (btn) {
                            btn.classList.toggle(
                                "active",
                                btn.dataset.tab === tab,
                            );
                        });
                    if (tab === "map") {
                        if (dashRaf) {
                            cancelAnimationFrame(dashRaf);
                            dashRaf = null;
                        }
                        setTimeout(function () {
                            map.invalidateSize();
                        }, 10);
                    } else {
                        dashEnter();
                    }
                }

                document.querySelectorAll(".tab-btn").forEach(function (btn) {
                    btn.addEventListener("click", function () {
                        setTab(btn.dataset.tab);
                    });
                });

                setTab("map");
            })();

            /* ── Bootstrap ────────────────────────────────────────────────────── */
            connect();
        </script>
    </body>
</html>
