<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
        />
        <title>FH6 Dashboard</title>
        <!-- PWA -->
        <link rel="manifest" href="/manifest.json" />
        <meta name="theme-color" content="#030712" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <meta name="apple-mobile-web-app-title" content="FH6" />
        <link rel="apple-touch-icon" href="/icons/icon-192.png" />
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        />
        <style>
            /* ── Reset ──────────────────────────────────────────────────────────── */
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            /* ── Theme variables ─────────────────────────────────────────────────
       Mirror the fh6-tel dark theme so the web view feels at home.         */
            :root {
                --bg: #030712;
                --bg-panel: #060c14;
                --bg-card: #0a1628;
                --bg-elevated: #0f1e35;
                --bd: #1a2d47;
                --bd-subtle: #142238;
                --tx: #e2e8f0;
                --tx-dim: #7a9ab5;
                --tx-xdim: #3d5a78;
                --ac: #3b82f6;
                --header-h: 46px;
            }

            html,
            body {
                height: 100%;
                overflow: hidden;
                background: var(--bg);
                color: var(--tx);
                font-family:
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    sans-serif;
                font-size: 13px;
                line-height: 1.4;
            }

            /* ── Header ──────────────────────────────────────────────────────────── */
            #header {
                height: var(--header-h);
                background: var(--bg-panel);
                border-bottom: 1px solid var(--bd);
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 16px;
                flex-shrink: 0;
                z-index: 1000;
                position: relative;
            }

            .header-title {
                font-size: 15px;
                font-weight: 700;
                letter-spacing: 0.06em;
                color: var(--tx);
                text-transform: uppercase;
            }
            .header-title span {
                color: var(--ac);
            }

            .conn-status {
                font-size: 11px;
                font-weight: 600;
                letter-spacing: 0.04em;
                font-family: "Courier New", monospace;
                transition: color 0.3s;
            }
            .conn-status.connected {
                color: #22c55e;
            }
            .conn-status.disconnected {
                color: var(--tx-xdim);
            }
            .conn-status.reconnecting {
                color: #f59e0b;
            }

            /* ── Tab navigation ──────────────────────────────────────────────────── */
            .tab-nav {
                display: flex;
                gap: 2px;
                background: var(--bg);
                border-radius: 6px;
                padding: 3px;
            }
            .tab-btn {
                background: transparent;
                border: none;
                color: var(--tx-dim);
                font-size: 11px;
                font-weight: 700;
                letter-spacing: 0.06em;
                text-transform: uppercase;
                padding: 5px 16px;
                border-radius: 4px;
                cursor: pointer;
                transition:
                    background 0.15s,
                    color 0.15s;
                font-family:
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    sans-serif;
            }
            .tab-btn:hover {
                background: var(--bg-elevated);
                color: var(--tx);
            }
            .tab-btn.active {
                background: var(--bg-elevated);
                color: var(--ac);
            }

            /* ── Main layout ─────────────────────────────────────────────────────── */
            #main-layout {
                display: flex;
                height: calc(100vh - var(--header-h));
                overflow: hidden;
            }

            /* ── Resizer handle ──────────────────────────────────────────────────── */
            #resizer {
                flex-shrink: 0;
                background: var(--bd);
                position: relative;
                z-index: 100;
                transition: background 0.15s;
                /* prevent scroll on touch while dragging */
                touch-action: none;
            }
            /* Drag-indicator pip */
            #resizer::after {
                content: "";
                position: absolute;
                background: var(--tx-xdim);
                border-radius: 2px;
                transition: background 0.15s;
            }
            #resizer:hover,
            #resizer.dragging {
                background: var(--bg-elevated);
            }
            #resizer:hover::after,
            #resizer.dragging::after {
                background: var(--ac);
            }
            /* Horizontal (row) split – desktop / landscape */
            #main-layout.split-row > #resizer {
                width: 5px;
                height: 100%;
                cursor: col-resize;
            }
            #main-layout.split-row > #resizer::after {
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                width: 2px;
                height: 48px;
            }
            /* Vertical (column) split – portrait mobile */
            #main-layout.split-col {
                flex-direction: column;
            }
            #main-layout.split-col > #resizer {
                width: 100%;
                height: 5px;
                cursor: row-resize;
            }
            #main-layout.split-col > #resizer::after {
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                height: 2px;
                width: 48px;
            }
            /* Guarantee full width for both panels in column mode. */
            #main-layout.split-col > #map-panel,
            #main-layout.split-col > #cards-panel {
                width: 100%;
                max-width: 100%;
            }

            /* ── Map panel ───────────────────────────────────────────────────────── */
            #map-panel {
                flex: 0 0 65%; /* overridden by JS resizer once loaded */
                position: relative;
                background: var(--bg-panel);
                min-width: 0;
                min-height: 0;
            }
            /* Separator border follows split direction */
            #main-layout.split-row > #map-panel {
                border-right: 1px solid var(--bd);
            }
            #main-layout.split-col > #map-panel {
                border-bottom: 1px solid var(--bd);
            }

            #map {
                width: 100%;
                height: 100%;
            }

            /* ── Cards panel ─────────────────────────────────────────────────────── */
            #cards-panel {
                flex: 0 0 35%; /* overridden by JS resizer once loaded */
                overflow-y: auto;
                overflow-x: hidden;
                background: var(--bg);
                padding: 8px;
                display: flex;
                flex-direction: column;
                gap: 8px;
                min-height: 0;
                min-width: 0;
                container-type: inline-size;
                container-name: cards;
            }
            #cards-panel::-webkit-scrollbar {
                width: 5px;
            }
            #cards-panel::-webkit-scrollbar-track {
                background: var(--bg);
            }
            #cards-panel::-webkit-scrollbar-thumb {
                background: var(--bd);
                border-radius: 3px;
            }
            #cards-panel::-webkit-scrollbar-thumb:hover {
                background: var(--bd-subtle);
            }

            #empty-state {
                color: var(--tx-xdim);
                font-size: 12px;
                text-align: center;
                padding: 32px 16px;
                letter-spacing: 0.04em;
            }

            /* ── Dashboard view (landscape-first) ──────────────────────────────────── */
            body[data-tab="dashboard"] #main-layout {
                display: none !important;
            }
            #dashboard-view {
                display: none;
                flex-direction: column;
                height: calc(100vh - var(--header-h));
                overflow: hidden;
                background: var(--bg);
            }
            body[data-tab="dashboard"] #dashboard-view {
                display: flex;
            }

            /* picker */
            #dash-picker {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                gap: 20px;
                padding: 24px;
            }
            #dash-picker > h2 {
                font-size: 12px;
                font-weight: 700;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                color: var(--tx-dim);
            }
            #dash-picker-list {
                display: flex;
                flex-wrap: wrap;
                gap: 14px;
                justify-content: center;
            }
            .dpk-card {
                background: var(--bg-card);
                border: 2px solid var(--bd);
                border-radius: 10px;
                padding: 18px 24px;
                cursor: pointer;
                min-width: 200px;
                max-width: 320px;
                flex: 1 1 200px;
                display: flex;
                flex-direction: column;
                gap: 10px;
                text-align: left;
                transition:
                    background 0.15s,
                    transform 0.1s;
            }
            .dpk-card:hover {
                background: var(--bg-elevated);
                transform: translateY(-2px);
            }
            .dpk-name {
                font-size: 15px;
                font-weight: 700;
                color: var(--tx);
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .dpk-dot {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                flex-shrink: 0;
            }
            .dpk-car {
                font-size: 11px;
                color: var(--tx-dim);
            }
            .dpk-stats {
                display: flex;
                gap: 18px;
                font-size: 11px;
                color: var(--tx-dim);
            }
            .dpk-stat-val {
                font-family: "Courier New", monospace;
                font-size: 16px;
                font-weight: 700;
                color: var(--tx);
                line-height: 1.1;
            }

            /* ── Telemetry view ──────────────────────────────────────────────────── */
            #dash-telem {
                display: none;
                flex-direction: column;
                flex: 1;
                min-height: 0;
                contain: layout;
            }

            /* Info bar */
            #dt-info {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 0 12px;
                height: 32px;
                background: var(--bg-panel);
                border-bottom: 1px solid var(--bd);
                flex-shrink: 0;
                font-size: 11px;
                overflow: hidden;
            }
            .dh-dot {
                width: 9px;
                height: 9px;
                border-radius: 50%;
                flex-shrink: 0;
            }
            #dh-name {
                font-weight: 700;
                color: var(--tx);
                flex-shrink: 0;
            }
            #dh-car {
                color: var(--tx-dim);
                min-width: 0;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
                flex: 1;
            }
            #dh-pos {
                background: var(--ac);
                color: #fff;
                font-weight: 800;
                font-size: 11px;
                padding: 1px 8px;
                border-radius: 4px;
                display: none;
                flex-shrink: 0;
            }
            #dh-lap {
                font-family: "Courier New", monospace;
                color: var(--tx-dim);
                flex-shrink: 0;
            }

            /* Rev bar */
            canvas#dash-rev {
                width: 100%;
                height: 20px;
                display: block;
                background: #020609;
                flex-shrink: 0;
            }

            /* Main mid area — 3-column landscape grid */
            #dt-mid {
                flex: 1;
                display: flex;
                min-height: 0;
                overflow: hidden;
            }

            /* ── Gear column ── */
            #dt-gear-col {
                width: 120px;
                flex-shrink: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                border-right: 1px solid var(--bd-subtle);
                gap: 10px;
                padding: 8px 4px;
            }
            #d-gear {
                font-family: "Courier New", monospace;
                font-size: clamp(4rem, 13vw, 9rem);
                font-weight: 900;
                line-height: 1;
                color: #fff;
                text-shadow:
                    0 0 30px rgba(59, 130, 246, 0.5),
                    0 0 70px rgba(59, 130, 246, 0.15);
                transition:
                    color 0.05s,
                    text-shadow 0.05s;
            }
            #dt-steer-wrap {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 3px;
            }
            #dt-steer-lbl {
                font-size: 8px;
                font-weight: 700;
                letter-spacing: 0.12em;
                color: var(--tx-xdim);
                text-transform: uppercase;
            }
            #dt-steer-track {
                width: 84px;
                height: 6px;
                background: var(--bg-elevated);
                border: 1px solid var(--bd);
                border-radius: 3px;
                position: relative;
                overflow: visible;
            }
            #dt-steer-center {
                position: absolute;
                width: 1px;
                height: 10px;
                background: var(--tx-xdim);
                top: -2px;
                left: 50%;
                transform: translateX(-50%);
            }
            #dt-steer-needle {
                position: absolute;
                width: 4px;
                height: 10px;
                background: var(--ac);
                border-radius: 2px;
                top: -2px;
                left: 50%;
                transform: translateX(-50%);
            }

            /* ── Speed / info column ── */
            #dt-speed-col {
                width: 140px;
                flex-shrink: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                border-right: 1px solid var(--bd-subtle);
                gap: 2px;
                padding: 8px;
            }
            #d-spd {
                font-family: "Courier New", monospace;
                font-size: clamp(2.5rem, 7vw, 5rem);
                font-weight: 900;
                color: var(--tx);
                line-height: 1;
                font-variant-numeric: tabular-nums;
            }
            .d-spd-unit {
                font-size: 0.75rem;
                font-weight: 700;
                letter-spacing: 0.12em;
                color: var(--tx-dim);
                text-transform: uppercase;
            }
            #dt-rpm-val {
                font-family: "Courier New", monospace;
                font-size: 0.75rem;
                font-weight: 700;
                color: var(--tx-dim);
                font-variant-numeric: tabular-nums;
                letter-spacing: 0.03em;
                margin-top: 5px;
            }
            #dt-boost-row {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 2px;
                margin-top: 6px;
                width: 100%;
            }
            .dt-boost-label {
                font-size: 8px;
                font-weight: 700;
                letter-spacing: 0.12em;
                color: var(--tx-xdim);
                text-transform: uppercase;
            }
            #dt-boost-val {
                font-family: "Courier New", monospace;
                font-size: 0.8rem;
                font-weight: 700;
                color: var(--tx);
                font-variant-numeric: tabular-nums;
            }
            .dt-boost-bar-track {
                width: 70%;
                height: 3px;
                background: var(--bg-elevated);
                border-radius: 2px;
                overflow: hidden;
            }
            #dt-boost-fill {
                height: 100%;
                width: 0%;
                background: var(--ac);
                border-radius: 2px;
            }

            /* ── Pedals + tires column ── */
            #dt-right-col {
                flex: 1;
                display: flex;
                flex-direction: column;
                min-width: 0;
                overflow: hidden;
            }
            #dt-pedals {
                flex: 1;
                display: flex;
                flex-direction: column;
                justify-content: center;
                gap: 7px;
                padding: 10px 16px 8px;
                min-height: 0;
            }
            .dtp-row {
                display: flex;
                align-items: center;
                gap: 8px;
                min-width: 0;
            }
            .dtp-lbl {
                font-size: 11px;
                font-weight: 800;
                letter-spacing: 0.08em;
                width: 12px;
                flex-shrink: 0;
                text-align: center;
            }
            .dtp-track {
                flex: 1;
                height: 14px;
                background: var(--bg-elevated);
                border: 1px solid var(--bd);
                border-radius: 3px;
                overflow: hidden;
                min-width: 0;
            }
            /* No transition — updates at 20 Hz via rAF */
            .dtp-fill {
                height: 100%;
                width: 0%;
                border-radius: 3px;
            }
            .dtp-pct {
                font-family: "Courier New", monospace;
                font-size: 10px;
                color: var(--tx-dim);
                width: 32px;
                text-align: right;
                flex-shrink: 0;
            }
            #dt-tires {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 4px;
                padding: 6px 16px;
                background: var(--bg-panel);
                border-top: 1px solid var(--bd-subtle);
                flex-shrink: 0;
            }
            .dtt-cell {
                background: var(--bg-elevated);
                border: 1px solid var(--bd);
                border-radius: 4px;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                padding: 3px 5px;
                gap: 1px;
            }
            .dtt-pos {
                font-size: 8px;
                font-weight: 800;
                letter-spacing: 0.1em;
                opacity: 0.6;
            }
            .dtt-temp {
                font-family: "Courier New", monospace;
                font-size: 13px;
                font-weight: 700;
                font-variant-numeric: tabular-nums;
            }
            .dtt-wear-bar {
                width: 100%;
                height: 2px;
                background: var(--bg-elevated);
                border-radius: 1px;
                overflow: hidden;
                margin-top: 1px;
            }
            .dtt-wear-fill {
                height: 100%;
                border-radius: 1px;
                background: #22c55e;
            }

            /* ── Bottom stats bar ── */
            #dt-bot {
                display: flex;
                align-items: center;
                padding: 0 8px;
                height: 36px;
                background: var(--bg-panel);
                border-top: 1px solid var(--bd);
                flex-shrink: 0;
                overflow: hidden;
            }
            .dtb-item {
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 0 9px;
                flex-shrink: 0;
            }
            .dtb-lbl {
                font-size: 7px;
                font-weight: 700;
                letter-spacing: 0.12em;
                color: var(--tx-xdim);
                text-transform: uppercase;
                line-height: 1;
            }
            .dtb-val {
                font-family: "Courier New", monospace;
                font-size: 13px;
                font-weight: 700;
                color: var(--tx);
                font-variant-numeric: tabular-nums;
                line-height: 1.2;
                white-space: nowrap;
            }
            .dtb-val.best {
                color: #a855f7;
            }
            .dtb-val.dim {
                color: var(--tx-dim);
            }
            .dtb-sep {
                width: 1px;
                height: 20px;
                background: var(--bd-subtle);
                flex-shrink: 0;
            }
            #dt-fuel-bar {
                width: 38px;
                height: 2px;
                background: var(--bg-elevated);
                border-radius: 1px;
                overflow: hidden;
                margin-top: 2px;
            }
            #dt-fuel-fill {
                height: 100%;
                width: 100%;
                background: #22c55e;
                border-radius: 1px;
            }
            /* Handbrake */
            #d-hb {
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 1px;
                padding: 0 8px;
                flex-shrink: 0;
                color: var(--tx-xdim);
                transition:
                    color 0.1s,
                    filter 0.1s;
            }
            #d-hb.active {
                color: #ef4444;
                filter: drop-shadow(0 0 5px rgba(239, 68, 68, 0.8));
            }
            #d-hb .dtb-lbl {
                color: inherit;
            }

            /* ── Dashboard in-menu overlay ───────────────────────────────────────── */
            #dash-telem[data-in-menu] canvas#dash-rev,
            #dash-telem[data-in-menu] #dt-mid {
                opacity: 0.12;
                pointer-events: none;
            }
            #dh-in-menu {
                display: none;
                font-size: 9px;
                font-weight: 800;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: var(--tx-xdim);
                background: var(--bg-elevated);
                border: 1px solid var(--bd);
                padding: 1px 7px;
                border-radius: 3px;
                flex-shrink: 0;
            }
            #dash-telem[data-in-menu] #dh-in-menu {
                display: inline;
            }
            #dash-telem[data-in-menu] #dh-class,
            #dash-telem[data-in-menu] #dh-car {
                opacity: 0.35;
            }

            /* ── Player card ─────────────────────────────────────────────────────── */
            .player-card {
                background: var(--bg-card);
                border: 1px solid var(--bd);
                border-radius: 8px;
                border-left-width: 3px; /* player colour accent set via style attr */
                padding: 10px 10px 10px 11px;
                position: relative;
                display: flex;
                flex-direction: column;
                gap: 7px;
                min-width: 0; /* prevent card expanding beyond its flex container */
            }

            /* header row: name + race position badge */
            .card-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
            }
            .card-label-row {
                display: flex;
                align-items: center;
                gap: 6px;
                min-width: 0;
            }
            .color-dot {
                width: 11px;
                height: 11px;
                border-radius: 50%;
                flex-shrink: 0;
                cursor: pointer;
                box-shadow: 0 0 0 0 transparent;
                transition: box-shadow 0.15s;
            }
            .color-dot:hover {
                box-shadow: 0 0 0 3px
                    color-mix(in srgb, var(--dot-color) 45%, transparent);
            }
            .color-dot.following {
                box-shadow:
                    0 0 0 3px
                        color-mix(in srgb, var(--dot-color) 60%, transparent),
                    0 0 0 6px
                        color-mix(in srgb, var(--dot-color) 22%, transparent);
                animation: dot-follow-pulse 1.4s ease-in-out infinite;
            }
            @keyframes dot-follow-pulse {
                0%,
                100% {
                    box-shadow:
                        0 0 0 3px
                            color-mix(
                                in srgb,
                                var(--dot-color) 60%,
                                transparent
                            ),
                        0 0 0 6px
                            color-mix(
                                in srgb,
                                var(--dot-color) 22%,
                                transparent
                            );
                }
                50% {
                    box-shadow:
                        0 0 0 4px
                            color-mix(
                                in srgb,
                                var(--dot-color) 75%,
                                transparent
                            ),
                        0 0 0 9px
                            color-mix(
                                in srgb,
                                var(--dot-color) 28%,
                                transparent
                            );
                }
            }
            /* right side of header: class badge + race position */
            .card-hdr-right {
                display: flex;
                align-items: center;
                gap: 5px;
                flex-shrink: 0;
            }
            .player-name {
                font-weight: 700;
                font-size: 13px;
                color: var(--tx);
                letter-spacing: 0.03em;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                min-width: 0;
                cursor: pointer;
                border-bottom: 1px dashed transparent;
                transition:
                    color 0.15s,
                    border-color 0.15s;
            }
            .player-name:hover {
                color: var(--ac);
                border-bottom-color: var(--ac);
            }
            .player-name-input {
                background: var(--bg-elevated);
                border: 1px solid var(--ac);
                border-radius: 3px;
                color: var(--tx);
                font-weight: 700;
                font-size: 13px;
                letter-spacing: 0.03em;
                padding: 0 4px;
                width: 100%;
                outline: none;
                font-family: inherit;
            }
            /* ── Car class badge (Forza-style coloured box + PI) ── */
            .car-class-badge {
                display: inline-flex;
                align-items: center;
                gap: 4px;
                flex-shrink: 0;
            }
            .car-class-letter {
                display: inline-block;
                color: #fff;
                font-size: 10px;
                font-weight: 900;
                font-family: "Segoe UI", system-ui, sans-serif;
                letter-spacing: 0.04em;
                padding: 1px 6px 2px;
                border-radius: 2px;
                min-width: 20px;
                text-align: center;
                line-height: 1.4;
            }
            .car-pi-val {
                font-family: "Courier New", monospace;
                font-size: 11px;
                font-weight: 700;
                color: var(--tx);
                letter-spacing: 0.02em;
            }
            .car-detail {
                font-size: 10px;
                color: var(--tx-dim);
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .car-ordinal {
                color: var(--tx-xdim);
                font-family: "Courier New", monospace;
                font-size: 9px;
            }
            .race-pos-badge {
                font-size: 9px;
                font-weight: 800;
                letter-spacing: 0.1em;
                color: var(--tx-xdim);
                background: var(--bg-elevated);
                padding: 1px 5px;
                border-radius: 3px;
                white-space: nowrap;
            }

            /* in-menu state */
            .in-menu-badge {
                display: inline-block;
                font-size: 9px;
                font-weight: 800;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: var(--tx-xdim);
                background: var(--bg-elevated);
                border: 1px solid var(--bd);
                padding: 1px 6px;
                border-radius: 3px;
            }
            .player-card[data-in-menu] .card-mid,
            .player-card[data-in-menu] .bar-row,
            .player-card[data-in-menu] .tire-row,
            .player-card[data-in-menu] .lap-row {
                opacity: 0.2;
                pointer-events: none;
            }

            /* mid row: speed+gear (left) | pedals (right) */
            .card-mid {
                display: flex;
                align-items: center;
                min-width: 0;
            }
            .card-speed-gear {
                display: flex;
                align-items: baseline;
                gap: 5px;
                flex-shrink: 0;
                padding-right: 8px;
            }
            .card-pedals {
                flex: 1;
                display: flex;
                flex-direction: column;
                gap: 3px;
                padding-left: 8px;
                border-left: 1px solid var(--bd);
                min-width: 0;
            }
            .speed-val {
                font-family: "Courier New", Courier, monospace;
                font-size: 22px;
                font-weight: 700;
                font-variant-numeric: tabular-nums;
                color: var(--tx);
                line-height: 1;
            }
            .speed-val .speed-unit {
                font-size: 11px;
                color: var(--tx-dim);
                margin-left: 3px;
            }
            .gear-box {
                font-family: "Courier New", Courier, monospace;
                font-size: 20px;
                font-weight: 700;
                font-variant-numeric: tabular-nums;
                color: var(--tx-dim);
                background: var(--bg-elevated);
                border: 1px solid var(--bd);
                padding: 2px 7px;
                border-radius: 5px;
                line-height: 1.3;
                min-width: 38px;
                text-align: center;
            }

            /* generic labelled bar row (RPM) */
            .bar-row {
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .bar-row-label {
                font-size: 9px;
                font-weight: 700;
                letter-spacing: 0.1em;
                color: var(--tx-xdim);
                width: 30px;
                flex-shrink: 0;
            }
            .bar-track {
                flex: 1;
                height: 7px;
                background: var(--bg-elevated);
                border-radius: 4px;
                overflow: hidden;
            }
            .bar-fill {
                height: 100%;
                border-radius: 4px;
                transition: width 80ms linear;
            }
            .bar-row-end {
                font-family: "Courier New", monospace;
                font-size: 9px;
                color: var(--tx-dim);
                width: 38px;
                text-align: right;
                flex-shrink: 0;
            }

            /* pedal rows */
            .pedal-row {
                display: flex;
                align-items: center;
                gap: 6px;
            }
            .pedal-lbl {
                font-size: 9px;
                font-weight: 800;
                letter-spacing: 0.1em;
                width: 10px;
                flex-shrink: 0;
                text-align: center;
            }
            .t-lbl {
                color: #22c55e;
            }
            .b-lbl {
                color: #ef4444;
            }
            .c-lbl {
                color: #6b7280;
            }
            .t-fill {
                background: #22c55e;
                transition: width 80ms linear;
            }
            .b-fill {
                background: #ef4444;
                transition: width 80ms linear;
            }
            .c-fill {
                background: #6b7280;
                transition: width 80ms linear;
            }
            .pedal-pct {
                font-family: "Courier New", monospace;
                font-size: 9px;
                color: var(--tx-dim);
                width: 28px;
                text-align: right;
                flex-shrink: 0;
            }

            /* tire row: all 4 in one line */
            .tire-row {
                display: flex;
                gap: 3px;
                min-width: 0;
            }
            .tire-row .tire-cell {
                flex: 1;
                min-width: 0;
            }
            .tire-cell {
                background: var(--bg-elevated);
                border: 1px solid var(--bd);
                border-radius: 5px;
                padding: 3px 5px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                transition:
                    background 0.25s,
                    border-color 0.25s,
                    color 0.25s;
            }
            .tire-pos {
                font-size: 9px;
                font-weight: 800;
                letter-spacing: 0.1em;
                opacity: 0.65;
            }
            .tire-temp-val {
                font-family: "Courier New", monospace;
                font-size: 11px;
                font-weight: 700;
                font-variant-numeric: tabular-nums;
            }

            /* lap info */
            .lap-row {
                display: flex;
                justify-content: space-between;
                align-items: baseline;
                gap: 4px;
            }
            .lap-num {
                font-size: 10px;
                color: var(--tx-xdim);
            }
            .lap-cur {
                font-family: "Courier New", monospace;
                font-size: 14px;
                font-weight: 700;
                color: var(--tx);
                font-variant-numeric: tabular-nums;
            }
            .lap-best {
                font-family: "Courier New", monospace;
                font-size: 10px;
                color: var(--tx-dim);
                font-variant-numeric: tabular-nums;
            }

            /* offline overlay */
            .offline-overlay {
                position: absolute;
                inset: 0;
                background: rgba(3, 7, 18, 0.78);
                backdrop-filter: blur(3px);
                display: none;
                align-items: center;
                justify-content: center;
                font-size: 16px;
                font-weight: 800;
                letter-spacing: 0.2em;
                color: #4b5563;
                border-radius: 8px;
            }

            /* ── Leaflet overrides ───────────────────────────────────────────────── */
            /* ── Narrow-card responsive fixes (container query) ─────────────────── */
            @container cards (max-width: 200px) {
                /* stack the mid-row vertically on very narrow panels */
                .card-mid {
                    flex-direction: column;
                    align-items: stretch;
                    gap: 5px;
                }
                .card-speed-gear {
                    padding-right: 0;
                }
                .card-pedals {
                    border-left: none;
                    border-top: 1px solid var(--bd);
                    padding-left: 0;
                    padding-top: 5px;
                }
                /* tire row falls back to 2×2 grid */
                .tire-row {
                    display: grid;
                    grid-template-columns: repeat(2, minmax(0, 1fr));
                    gap: 3px;
                }
                .tire-row .tire-cell {
                    flex: unset;
                }
                .speed-val {
                    font-size: 18px;
                }
                .gear-box {
                    font-size: 17px;
                    min-width: 32px;
                    padding: 2px 5px;
                }
                .bar-row-label {
                    width: 24px;
                }
                .bar-row-end {
                    width: 32px;
                }
                .lap-row {
                    flex-wrap: wrap;
                    row-gap: 2px;
                }
                .lap-cur {
                    font-size: 12px;
                }
                .lap-best {
                    font-size: 8px;
                    width: 100%;
                    text-align: right;
                }
            }

            .leaflet-container {
                background: #030712 !important;
                font-family: system-ui, sans-serif !important;
            }
            .leaflet-tile {
                /* slight border-radius softens the tile grid seams at low zoom */
                image-rendering: auto;
            }
            /* Strip Leaflet's default divIcon box so the SVG arrow shows cleanly */
            .player-arrow-icon {
                background: none !important;
                border: none !important;
            }

            /* Arrow marker inner elements */
            .pm-wrap {
                display: flex;
                flex-direction: column;
                align-items: center;
                pointer-events: none;
                user-select: none;
                width: 80px;
            }
            .pm-label {
                background: rgba(3, 7, 18, 0.88);
                color: #e2e8f0;
                font-size: 10px;
                font-weight: 700;
                padding: 1px 5px;
                border-radius: 3px;
                white-space: nowrap;
                max-width: 78px;
                overflow: hidden;
                text-overflow: ellipsis;
                margin-bottom: 2px;
                letter-spacing: 0.04em;
                border: 1px solid rgba(255, 255, 255, 0.08);
            }
        </style>
    </head>
    <body>
        <!-- ── Header ─────────────────────────────────────────────────── -->
        <header id="header">
            <a
                class="header-title"
                href="https://github.com/potchin/fh6-web"
                target="_blank"
                rel="noopener"
                style="text-decoration: none"
                >FH6 <span>Dashboard</span></a
            >
            <nav class="tab-nav" id="tab-nav">
                <button class="tab-btn" data-tab="map">Map</button>
                <button class="tab-btn" data-tab="dashboard">Dashboard</button>
            </nav>
            <span class="conn-status disconnected" id="conn-status"
                >● DISCONNECTED</span
            >
        </header>

        <!-- ── Main layout ────────────────────────────────────────────── -->
        <div id="main-layout" class="split-row">
            <div id="map-panel">
                <div id="map"></div>
            </div>
            <div id="resizer" aria-hidden="true"></div>
            <div id="cards-panel">
                <p id="empty-state">Waiting for players…</p>
            </div>
        </div>

        <!-- ── Dashboard view ──────────────────────────────────────────── -->
        <div id="dashboard-view">
            <!-- Player picker -->
            <div id="dash-picker">
                <h2>Select Player</h2>
                <div id="dash-picker-list"></div>
            </div>

            <!-- Landscape telemetry view -->
            <div id="dash-telem">
                <!-- Info bar -->
                <div id="dt-info">
                    <span class="dh-dot" id="dh-dot"></span>
                    <span id="dh-name"></span>
                    <span id="dh-class"></span>
                    <span id="dh-car"></span>
                    <span id="dh-in-menu">IN MENU</span>
                    <span id="dh-pos"></span>
                    <span id="dh-lap"></span>
                </div>

                <!-- Rev lights -->
                <canvas id="dash-rev"></canvas>

                <!-- Main 3-column area -->
                <div id="dt-mid">
                    <!-- Col 1: Gear + steer -->
                    <div id="dt-gear-col">
                        <span id="d-gear">&mdash;</span>
                        <div id="dt-steer-wrap">

                                <div id="dt-steer-center"></div>
                                <div id="dt-steer-needle"></div>

                    <!-- Col 2: Speed, RPM, boost -->
                    <div id="dt-speed-col">

                            height="18"

                                cy="10"
                                r="8.5"
                                stroke="currentColor"
                                stroke-width="1.5"
                                fill="none"
                            />
                            <text
                                x="10"
                                y="14.2"
                                text-anchor="middle"
                                font-size="9.5"
                                font-weight="900"
                                font-family="system-ui,sans-serif"
